      <div class="choices" id="qz-choices">
        ${q.c.map((ch,i)=>`<button class="choice" onclick="answerQ(${i})"><span class="choice-lbl">${LBLS[i]}</span><span>${ch}</span></button>`).join('')}
      </div>
      <div id="qz-exp"></div>
      <button id="btn-next" class="btn-next" style="display:none" onclick="nextQ()"></button>
    </div>`;
  if(settings.timer)startTimer('qz');
}

function answerQ(idx){
  if(QZ.answered)return;
  QZ.answered=true;stopTimer();
  const q=QZ.qs[QZ.idx];
  const ok=idx===q.a;
  if(ok)QZ.score++;
  recordAns(q,ok,QZ.subj==='復習'?q._subj||'復習':QZ.subj);
  showChoiceResult('qz-choices',q.a,idx);
  if(getSettings().exp){
    const expEl=document.getElementById('qz-exp');
    if(expEl)expEl.innerHTML=buildExp(q,ok);
  }
  const nb=document.getElementById('btn-next');
  if(nb){nb.style.display='block';nb.textContent=QZ.idx+1<QZ.qs.length?'次の問題 →':'結果を見る';}
  if(!ok&&!QZ.isReview)addReview(q);
  if(ok&&QZ.isReview)removeReview(q);
}

function toggleFlag(){
  if(QZ.flags.has(QZ.idx))QZ.flags.delete(QZ.idx);else QZ.flags.add(QZ.idx);
  const btn=document.getElementById('flag-btn');
  if(btn){btn.className='qz-flag-btn'+(QZ.flags.has(QZ.idx)?' flagged':'');btn.textContent=QZ.flags.has(QZ.idx)?'🚩 要確認':'⬜ 見直し';}
}

function nextQ(){
  QZ.idx++;
  if(QZ.idx<QZ.qs.length)renderQ();else showResult();
}

function showChoiceResult(cid,correct,chosen){
  const btns=document.querySelectorAll('#'+cid+' .choice');
  btns.forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add('correct');if(i===chosen&&chosen!==correct)b.classList.add('wrong');});
  if(chosen===correct){const ri=document.createElement('div');ri.className='result-icon';ri.textContent='✅';btns[correct].insertAdjacentElement('beforebegin',ri);}
  else if(chosen>=0){const ri=document.createElement('div');ri.className='result-icon';ri.textContent='❌';btns[chosen].insertAdjacentElement('beforebegin',ri);}
}

function buildExp(q,ok){
  return `<div class="exp-box ${ok?'correct':'wrong'}">
    <div class="exp-head ${ok?'correct':'wrong'}">${ok?'✓ 正解！':'✗ 不正解'}</div>
    ${q.law?`<span class="exp-law">📖 ${q.law}</span>`:''}
    <div style="color:var(--text);line-height:1.75;margin-top:6px">${q.exp||''}</div>
    ${q.warn?`<div class="exp-warn">⚠️ <strong>間違えやすいポイント：</strong>${q.warn}</div>`:''}
    ${q.tip?`<div class="exp-tip">💡 <strong>覚え方のコツ：</strong>${q.tip}</div>`:''}
  </div>`;
}

// ═══════════════════════════════════════════════
// RESULT
// ═══════════════════════════════════════════════
function showResult(){
  stopTimer();
  const total=QZ.qs.length;
  const pct=Math.round(QZ.score/total*100);
  const grade=pct>=80?'🎉':pct>=60?'👍':'📚';
  const msg=pct>=80?'合格ラインを超えています！':pct>=60?'あと少し！苦手問題を復習しよう':'復習リストを活用して弱点克服！';

  const stats=getStats();
  stats.history.push({date:new Date().toISOString().slice(0,10),pct,subj:QZ.subj});
  if(stats.history.length>14)stats.history=stats.history.slice(-14);
  stats.sessions++;
  saveStats(stats);

  const review=getReview();
  const flagList=QZ.flags.size>0?[...QZ.flags].map(i=>QZ.qs[i]):[];

  // Build flag list block separately
  let flagBlock='';
  if(flagList.length>0){
    let flagItems='';
    flagList.forEach((q,i)=>{flagItems+=`<div style="font-size:12px;color:var(--text2);padding:6px 0;border-bottom:1px solid var(--border)">${i+1}. ${q.q.slice(0,40)}…</div>`;});
    flagBlock=`<div class="card" style="margin-top:10px">
      <div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px">🚩 見直しフラグ (${flagList.length}問)</div>
      ${flagItems}
    </div>`;
  }

  const reviewBlock=review.length>0&&!QZ.isReview
    ?`<div style="display:flex;align-items:center;justify-content:space-between;background:var(--amber-bg);border:1px solid var(--amber-light);border-radius:var(--r-sm);padding:10px 14px;margin-top:10px">
        <span style="font-size:13px;color:var(--amber)">📌 復習リスト: ${review.length}問</span>
        <button onclick="startReview()" style="font-size:12px;color:var(--amber);background:var(--bg2);border:1px solid var(--amber);border-radius:6px;padding:4px 10px;cursor:pointer">復習する</button>
      </div>`
    :'';

  const retryBtn=!QZ.isReview&&QZ.subj!=='暇問'
    ?`<button class="btn-next" onclick="startQuiz('${QZ.subj}')">同じ科目をもう一度</button>`
    :'';

  document.getElementById('tab-quiz').innerHTML=`
    <div style="padding-top:16px">
      <div class="card result-hero">
        <div class="rh-grade">${grade}</div>
        <div><span class="rh-score">${QZ.score}</span><span class="rh-denom"> / ${total}</span></div>
        <div class="rh-pct">正解率 ${pct}%</div>
        <div class="rh-msg" style="margin-top:8px">${msg}</div>
      </div>
      ${flagBlock}
      ${reviewBlock}
      <div class="result-actions">
        ${retryBtn}
        <button class="btn-outline" onclick="showTab('home');renderHome()">ホームへ</button>
        <button class="btn-outline" onclick="showTab('stats');renderStats()">結果を分析する</button>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════
// EXAM MODE
// ═══════════════════════════════════════════════
let EX={qs:[],idx:0,answers:[],flags:new Set(),timer:null,tleft:210*60};

function startExam(){
  if(!confirm('模擬試験を開始しますか？\n70問・制限時間210分（3時間30分）\n\n一度始めると中断できません。'))return;
  const allQ=getAllQ();
  const pool=[];
  Object.keys(QDB_BASE).forEach(s=>{
    const qs=shuffle(allQ[s]);
    pool.push(...qs.slice(0,14).map(q=>({...q,_subj:s})));
  });
  EX={qs:shuffle(pool).slice(0,70),idx:0,answers:new Array(70).fill(-1),flags:new Set(),timer:null,tleft:210*60};
  updateStreak();
  showTab('quiz');
  renderExam();
}

function renderExam(){
  const q=EX.qs[EX.idx];
  const LBLS=['A','B','C','D'];
  const mins=Math.floor(EX.tleft/60),secs=EX.tleft%60;
  const timerCls=EX.tleft<600?'exam-timer danger':EX.tleft<1800?'exam-timer warn':'exam-timer';
  const answeredCount=EX.answers.filter(a=>a>=0).length;
  const progPct=answeredCount/70*100;

  // Build exam map separately to avoid nested template literal
  let mapHTML='';
  for(let i=0;i<EX.qs.length;i++){
    const cls=i===EX.idx?'current':EX.flags.has(i)?'flagged':EX.answers[i]>=0?'answered':'';
    mapHTML+=`<div class="exam-map-dot ${cls}" onclick="jumpExam(${i})">${i+1}</div>`;
  }

  // Build choices separately
  let choicesHTML='';
  q.c.forEach((ch,i)=>{
    const sel=EX.answers[EX.idx]===i;
    choicesHTML+=`<button class="choice${sel?' correct':''}" onclick="chooseExam(${i})" style="${sel?'border-color:var(--blue);background:var(--blue-bg)':''}"><span class="choice-lbl">${LBLS[i]}</span><span>${ch}</span></button>`;
  });

  const prevBtn=EX.idx>0?`<button class="btn-outline" style="flex:1" onclick="prevExam()">← 前の問題</button>`:`<div style="flex:1"></div>`;
  const nextBtn=EX.idx<EX.qs.length-1
    ?`<button class="btn-next" style="flex:1" onclick="nextExam()">次の問題 →</button>`
    :`<button class="btn-next" style="flex:1;background:var(--red)" onclick="finishExam()">試験を終了</button>`;

  document.getElementById('tab-quiz').innerHTML=`
    <div>
      <div class="exam-nav">
        <div class="${timerCls}" id="ex-timer">${mins}:${String(secs).padStart(2,'0')}</div>
        <div class="exam-prog-wrap">
          <div class="exam-prog-label">${EX.idx+1}/70問 (回答済: ${answeredCount})</div>
          <div class="prog-outer" style="margin:0"><div class="prog-inner" style="width:${progPct}%"></div></div>
        </div>
      </div>
      <div style="padding-top:12px">
        <div class="sec-h">問題マップ</div>
        <div class="exam-map">${mapHTML}</div>
        <div class="qz-header" style="margin-top:12px">
          <span class="qz-meta">${EX.idx+1}問目 — ${q._subj||''}</span>
          <button class="qz-flag-btn ${EX.flags.has(EX.idx)?'flagged':''}" onclick="flagExam()">
            ${EX.flags.has(EX.idx)?'🚩 要確認':'⬜ 見直し'}
          </button>
        </div>
        <div class="q-card" style="margin-top:8px">
          ${q.year?`<span class="q-year-badge">${q.year}</span>`:''}
          <div class="q-text">${q.q}</div>
        </div>
        <div class="choices">${choicesHTML}</div>
        <div style="display:flex;gap:8px;margin-top:12px">
          ${prevBtn}${nextBtn}
        </div>
      </div>
    </div>`;
  startExamTimer();
}

function startExamTimer(){
  if(EX.timer)clearInterval(EX.timer);
  EX.timer=setInterval(()=>{
    EX.tleft--;
    const t=document.getElementById('ex-timer');
    if(!t){clearInterval(EX.timer);return;}
    const m=Math.floor(EX.tleft/60),s=EX.tleft%60;
    t.textContent=m+':'+String(s).padStart(2,'0');
    t.className=EX.tleft<600?'exam-timer danger':EX.tleft<1800?'exam-timer warn':'exam-timer';
    if(EX.tleft<=0){clearInterval(EX.timer);alert('時間終了です。採点します。');finishExam();}
  },1000);
}

function chooseExam(idx){EX.answers[EX.idx]=idx;renderExam();}
function flagExam(){if(EX.flags.has(EX.idx))EX.flags.delete(EX.idx);else EX.flags.add(EX.idx);renderExam();}
function jumpExam(i){EX.idx=i;renderExam();}
function nextExam(){if(EX.idx<69){EX.idx++;renderExam();}}
function prevExam(){if(EX.idx>0){EX.idx--;renderExam();}}

function finishExam(){
  if(EX.timer)clearInterval(EX.timer);
  let total=0,bySubj={};
  EX.qs.forEach((q,i)=>{
    const ok=EX.answers[i]===q.a;
    if(ok)total++;
    const s=q._subj||'その他';
    if(!bySubj[s])bySubj[s]={ok:0,all:0};
    bySubj[s].all++;if(ok)bySubj[s].ok++;
  });
  const pct=Math.round(total/70*100);
  const pass=total>=35;
  const weakSubj=Object.keys(bySubj).filter(s=>Math.round(bySubj[s].ok/bySubj[s].all*100)<50);

  const stats=getStats();
  stats.history.push({date:new Date().toISOString().slice(0,10),pct,subj:'模擬試験'});
  stats.sessions++;
  if(stats.history.length>14)stats.history=stats.history.slice(-14);
  saveStats(stats);

  // Build subject bars separately to avoid nested template literals
  let subjBarsHTML='';
  Object.keys(bySubj).forEach(s=>{
    const p=Math.round(bySubj[s].ok/bySubj[s].all*100);
    const cls=p>=70?'high':p>=50?'mid':'low';
    const icon=(SMETA[s]||{icon:'📚'}).icon;
    const badge=p<50?'<span class="srb-badge">要復習</span>':'';
    subjBarsHTML+=`<div class="srb-row">
      <div class="srb-label">${icon} ${s.replace('法','')}</div>
      <div class="srb-track"><div class="srb-fill ${cls}" style="width:${p}%"><span class="srb-pct">${bySubj[s].ok}/${bySubj[s].all}</span></div></div>
      ${badge}
    </div>`;
  });

  const weakBlock=weakSubj.length>0
    ?`<div style="background:var(--red-bg);border:1px solid var(--red-light);border-radius:var(--r-sm);padding:12px;margin-top:10px">
        <div style="font-size:13px;font-weight:700;color:var(--red);margin-bottom:6px">⚠️ 重点復習が必要な科目</div>
        <div style="font-size:13px;color:var(--text)">${weakSubj.join('、')}</div>
      </div>`
    :'';

  const judgeBg=pass?'var(--green-bg)':'var(--red-bg)';
  const judgeColor=pass?'var(--green)':'var(--red)';
  const judgeBorder=pass?'var(--green-light)':'var(--red-light)';
  const judgeText=pass?'合格ライン達成':'不合格ライン';
  const resultMsg=pass?'すべての科目でバランスよく得点できました！':'苦手科目を重点的に復習しましょう。';

  document.getElementById('tab-quiz').innerHTML=`
    <div style="padding-top:16px">
      <div class="card result-hero">
        <div class="rh-grade">${pass?'🎉':'📚'}</div>
        <div><span class="rh-score">${total}</span><span class="rh-denom"> / 70</span></div>
        <div class="rh-pct">正解率 ${pct}%</div>
        <div style="margin-top:12px;display:inline-block;padding:8px 20px;border-radius:20px;font-size:16px;font-weight:800;background:${judgeBg};color:${judgeColor};border:1px solid ${judgeBorder}">${judgeText}</div>
        <div class="rh-msg" style="margin-top:8px">${resultMsg}</div>
      </div>
      <div class="card" style="margin-top:10px">
        <div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:12px">科目別結果</div>
        <div class="subj-result-bars">${subjBarsHTML}</div>
      </div>
      ${weakBlock}
      <div class="result-actions" style="margin-top:12px">
        <button class="btn-outline" onclick="showTab('home');renderHome()">ホームへ</button>
      </div>
    </div>`;
}

function startTimer(pfx){
  QZ.tleft=30;
  if(QZ.timer)clearInterval(QZ.timer);
  QZ.timer=setInterval(()=>{
    QZ.tleft--;
    const p=QZ.tleft/30*100;
    const bar=document.getElementById(pfx+'-tbar');
    const sec=document.getElementById(pfx+'-tsec');
    if(!bar||!sec){clearInterval(QZ.timer);return;}
    bar.style.width=p+'%';
    bar.className='timer-bar'+(QZ.tleft<=10?' danger':QZ.tleft<=20?' warn':'');
    sec.textContent=QZ.tleft+'秒';
    if(QZ.tleft<=0){
      clearInterval(QZ.timer);
      if(!QZ.answered){
        if(pfx==='qk')answerQuick(-1);else answerQ(-1);
      }
    }
  },1000);
}
function stopTimer(){if(QZ.timer){clearInterval(QZ.timer);QZ.timer=null;}}

// RECORD
// ═══════════════════════════════════════════════
function recordAns(q,ok,subj){
  const stats=getStats();
  stats.totalAns++;if(ok)stats.totalOk++;
  if(!stats.subjStats[subj])stats.subjStats[subj]={ans:0,ok:0};
  stats.subjStats[subj].ans++;if(ok)stats.subjStats[subj].ok++;
  saveStats(stats);
}
function addReview(q){const r=getReview();if(!r.some(x=>x.q===q.q)){r.push(q);saveReview(r);}}
function removeReview(q){saveReview(getReview().filter(x=>x.q!==q.q));}

// ═══════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════
function renderStats(){
  const stats=getStats();
  const strk=getStreak();
  const pct=stats.totalAns>0?Math.round(stats.totalOk/stats.totalAns*100):0;
  document.getElementById('st-total').textContent=stats.totalAns;
  document.getElementById('st-pct').textContent=pct+'%';
  document.getElementById('st-streak').textContent=strk.cur;

  const bc=document.getElementById('subj-chart');
  bc.innerHTML='';
  Object.keys(QDB_BASE).forEach(subj=>{
    const ss=stats.subjStats[subj]||{ans:0,ok:0};
    const p=ss.ans>0?Math.round(ss.ok/ss.ans*100):null;
    const cls=p===null?'':p>=70?'high':p>=50?'mid':'low';
    const m=SMETA[subj]||{icon:'📚'};
    bc.innerHTML+=`<div class="chart-row">
      <div class="cr-label">${m.icon} ${subj.replace('法','').replace('衛生','安衛')}</div>
      <div class="cr-track"><div class="cr-fill ${cls}" style="width:${p||0}%">${p!==null?`<span class="cr-pct">${p}%</span>`:''}</div></div>
      ${p!==null&&p<60?'<span class="cr-badge">要復習</span>':''}
    </div>`;
  });

  const hb=document.getElementById('hist-bars');
  const hl=document.getElementById('hist-labels');
  hb.innerHTML='';hl.innerHTML='';
  const h=stats.history.slice(-14);
  if(!h.length){hb.innerHTML='<span style="font-size:12px;color:var(--text3)">記録なし</span>';return;}
  h.forEach(item=>{
    const bar=document.createElement('div');
    bar.className='hist-bar';
    bar.style.height=Math.max(item.pct,3)+'%';
    bar.style.background=item.pct>=70?'var(--green)':item.pct>=50?'var(--amber)':'var(--red)';
    bar.title=item.date+' '+item.pct+'%';
    hb.appendChild(bar);
    const lbl=document.createElement('div');
    lbl.className='hist-lbl';lbl.textContent=item.date.slice(5);
    hl.appendChild(lbl);
  });

  // Calendar
  const cal=document.getElementById('cal-grid');
  cal.innerHTML='';
  const now=new Date();
  for(let i=27;i>=0;i--){
    const d=new Date(now.getTime()-i*86400000).toISOString().slice(0,10);
    const studied=stats.studyDates.includes(d);
    const pctDay=studied?stats.history.filter(h=>h.date===d).reduce((acc,h,_,arr)=>acc+h.pct/arr.length,0):0;
    const div=document.createElement('div');
    div.className='cal-day'+(studied?pctDay>=70?' studied great':' studied':'');
    div.title=d+(studied?' 学習済':'');
    cal.appendChild(div);
  }
}

function saveCustomQ(){
  const q={
    q:document.getElementById('f-q').value.trim(),
    c:[0,1,2,3].map(i=>document.getElementById('f-c'+i).value.trim()),
    a:parseInt(document.getElementById('f-a').value),
    subj:document.getElementById('f-subj').value,
    exp:document.getElementById('f-exp').value.trim(),
    law:document.getElementById('f-law').value.trim(),
    tip:document.getElementById('f-tip').value.trim(),
    warn:document.getElementById('f-warn').value.trim(),
    _custom:true,
  };
  if(!q.q){alert('問題文を入力してください');return;}
  if(!q.c[0]){alert('選択肢Aを入力してください');return;}
  const custom=getCustomQ();
  if(editIdx>=0)custom[editIdx]=q;else custom.push(q);
  saveCustomQData(custom);
  closeModal();
  renderQManager();
}

function editCustomQ(idx){openAddModal(idx);}
function deleteCustomQ(idx){
  if(!confirm('この問題を削除しますか？'))return;
  const custom=getCustomQ();
  custom.splice(idx,1);
  saveCustomQData(custom);
  renderQManager();
}

function exportJSON(){
  const custom=getCustomQ();
  const data={version:'3.0',exported:new Date().toISOString(),questions:custom};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sharoshi_custom_questions.json';a.click();
}

function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      const qs=data.questions||data;
      if(!Array.isArray(qs))throw new Error('形式エラー');
      const custom=getCustomQ();
      let added=0;
      qs.forEach(q=>{
        if(q.q&&q.c&&Array.isArray(q.c)&&typeof q.a==='number'){custom.push({...q,_custom:true});added++;}
      });
      saveCustomQData(custom);
      alert(added+'問をインポートしました！');
      renderQManager();
    }catch{alert('JSONの形式が正しくありません');}
  };
  r.readAsText(file);
  e.target.value='';
}

// ═══════════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════════
function toggleSetting(key,el){
  const s=getSettings();
  s[key]=!s[key];
  saveSettings(s);
  el.className='toggle'+(s[key]?' on':'');
}
function loadSettings(){
  const s=getSettings();
  ['timer','exp','custom'].forEach(k=>{
    const el=document.getElementById('tog-'+k);
    if(el)el.className='toggle'+(s[k]?' on':'');
  });
}
function resetStats(){if(confirm('学習データをリセットしますか？')){LS.set('sr3_stats',{totalAns:0,totalOk:0,sessions:0,subjStats:{},history:[],studyDates:[]});alert('リセットしました');renderHome();}}
function clearReview(){if(confirm('復習リストをクリアしますか？')){saveReview([]);renderHome();}}

// ═══════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════
function closeModal(){document.getElementById('modal-backdrop').style.display='none';}
function closeModalBackdrop(e){if(e.target===document.getElementById('modal-backdrop'))closeModal();}

renderHome();
loadSettings();
